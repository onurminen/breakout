version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/onurminen/breakout/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.14.0
    out: ui/src/gen
    opt: target=ts
