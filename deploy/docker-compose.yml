name: breakout

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094" # for clients on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics come from kafka-init only
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics once Kafka is up, then exits. See docs/architecture.md#kafka-topics.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ticks --partitions 12
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ema-results --partitions 1
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic advisories --partitions 1
    restart: "no"

  postgres:
    image: postgres:17.6
    ports:
      - "5432:5432"
    environment: # local development only
      POSTGRES_USER: breakout
      POSTGRES_PASSWORD: breakout
      POSTGRES_DB: breakout
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment: # local development only: no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # for container names
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro # Docker Desktop's image store
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
