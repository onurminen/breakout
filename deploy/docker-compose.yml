name: breakout

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094" # for clients on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A new group waits this long for more members before its first assignment, so
      # engines started together share the partitions without re-reading (docs/evaluation.md).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics come from kafka-init only
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics once Kafka is up, then exits. See docs/architecture.md#kafka-topics.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ticks --partitions 12
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ema-results --partitions 1
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists --topic advisories --partitions 1
    restart: "no"

  ingestion:
    build:
      context: ..
      args:
        SERVICE: ingestion
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment: # set from the shell by tools/experiments
      KAFKA_BROKERS: kafka:9092
      REPLAY_SPEED: ${REPLAY_SPEED:-0}
      REPLAY_FROM: ${REPLAY_FROM:-}
      SYMBOLS: ${SYMBOLS:-}
    command: ${INGEST_FILES:-/data/debs2022-gc-trading-day-08-11-21.csv} # day files in date order, separated by spaces
    volumes:
      - ../data:/data:ro
    profiles: [pipeline] # not started by a plain `up`; run with `up ingestion`

  # No container name, so `up --scale engine=4` works; Prometheus finds the replicas by DNS.
  engine:
    build:
      context: ..
      args:
        SERVICE: engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      GRACE_MS: "1000"
    cpus: ${ENGINE_CPUS:-0} # per replica; 0 = no limit
    profiles: [pipeline]

  sink:
    build:
      context: ..
      args:
        SERVICE: sink
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started # the sink retries until Postgres accepts connections
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://breakout:breakout@postgres:5432/breakout
    profiles: [pipeline]

  # Consumer group lag and topic end offsets for Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure # until Kafka accepts connections

  postgres:
    image: postgres:17.6
    ports:
      - "5432:5432"
    environment: # local development only
      POSTGRES_USER: breakout
      POSTGRES_PASSWORD: breakout
      POSTGRES_DB: breakout
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment: # local development only: no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # for container names
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro # Docker Desktop's image store
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
