global:
  scrape_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:2112"]

  - job_name: engine
    dns_sd_configs: # one target per replica of the Compose service
      - names: [engine]
        type: A
        port: 2112
